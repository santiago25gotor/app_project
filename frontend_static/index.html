<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Fútbol</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: white;
    }

    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-field {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 0.75rem;
      border-radius: 0.5rem;
      width: 100%;
      transition: all 0.3s;
    }

    .input-field:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid #334155;
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Recomendado cuando sirves el frontend desde el mismo FastAPI:
    const API_URL = "/api";

    function App() {
      const [user, setUser] = useState(null);
      const [view, setView] = useState("login"); // login, register, forgot, dashboard

      useEffect(() => {
        const storedUser = localStorage.getItem("user");
        if (storedUser) setUser(JSON.parse(storedUser));
      }, []);

      useEffect(() => {
        if (user) setView("dashboard");
        else if (view === "dashboard") setView("login");
      }, [user]);

      // Listener para "Olvidé mi contraseña" sin reestructurar
      useEffect(() => {
        const handler = () => setView("forgot");
        window.addEventListener("go-forgot", handler);
        return () => window.removeEventListener("go-forgot", handler);
      }, []);

      const handleLogin = (userData) => {
        setUser(userData);
        localStorage.setItem("user", JSON.stringify(userData));
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem("user");
        setView("login");
      };

      return (
        <div className="min-h-screen flex flex-col">
          <nav className="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
            <div className="flex items-center">
              <img src="images/logo.png" alt="Football Manager Logo" className="h-20 w-auto object-contain drop-shadow-lg" />
            </div>
            {user && (
              <div className="flex items-center space-x-4">
                <span className="text-gray-300">Hola, <span className="text-white font-semibold">{user.username}</span></span>
                <button onClick={handleLogout} className="text-sm bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1 rounded-full transition">
                  <i className="fas fa-sign-out-alt"></i> Salir
                </button>
              </div>
            )}
          </nav>

          <main className="flex-1 container mx-auto p-4 md:p-8">
            {view === "login" && <Login onLogin={handleLogin} onSwitch={() => setView("register")} />}
            {view === "register" && <Register onGoLogin={() => setView("login")} />}
            {view === "forgot" && <ForgotPassword onGoLogin={() => setView("login")} />}
            {view === "dashboard" && <Dashboard />}
          </main>
        </div>
      );
    }

    function Login({ onLogin, onSwitch }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError("");
        try {
          const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Error en login");

          onLogin({ username });
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-md mx-auto mt-20 animate-fade-in">
          <div className="card space-y-6">
            <h2 className="text-3xl font-bold text-center">Bienvenido</h2>
            <p className="text-center text-gray-400">Inicia sesión para gestionar tu equipo</p>

            {error && <div className="bg-red-500/10 text-red-500 p-3 rounded text-center text-sm">{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-4" autoComplete="on">
              <div>
                <label className="block text-sm font-medium text-gray-400 mb-1">Usuario</label>
                <input
                  className="input-field"
                  type="text"
                  name="username"
                  autoComplete="username"
                  value={username}
                  onChange={e => setUsername(e.target.value)}
                  required
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-400 mb-1">Contraseña</label>
                <input
                  className="input-field"
                  type="password"
                  name="password"
                  autoComplete="current-password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  required
                />
              </div>
              <button className="btn-primary w-full" disabled={loading}>
                {loading ? "Cargando..." : "Entrar"}
              </button>
            </form>

            <p className="text-center text-gray-500 text-sm">
              <button
                type="button"
                onClick={() => window.dispatchEvent(new CustomEvent("go-forgot"))}
                className="text-blue-400 hover:underline"
              >
                ¿Olvidaste tu contraseña?
              </button>
            </p>

            <p className="text-center text-gray-500 text-sm">
              ¿No tienes cuenta? <button onClick={onSwitch} className="text-blue-400 hover:underline">Regístrate</button>
            </p>
          </div>
        </div>
      );
    }

    function Register({ onGoLogin }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [passwordConfirm, setPasswordConfirm] = useState("");
      const [email, setEmail] = useState("");

      const [needsVerify, setNeedsVerify] = useState(false);
      const [code, setCode] = useState("");

      const [error, setError] = useState("");
      const [success, setSuccess] = useState("");
      const [loading, setLoading] = useState(false);
      const [loadingVerify, setLoadingVerify] = useState(false);
      const [loadingResend, setLoadingResend] = useState(false);

      const handleRegister = async (e) => {
        e.preventDefault();
        setError("");
        setSuccess("");

        if (password !== passwordConfirm) {
          setError("Las contraseñas no coinciden.");
          return;
        }

        setLoading(true);

        try {
          const res = await fetch(`${API_URL}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, email })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Error en registro");

          setNeedsVerify(true);
          setSuccess(data.message || "Se envió un código. Ingresa el código para finalizar.");
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleVerify = async (e) => {
        e.preventDefault();
        setError("");
        setSuccess("");
        setLoadingVerify(true);

        try {
          const res = await fetch(`${API_URL}/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, code })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Error verificando código");

          setSuccess("✓ Cuenta verificada. Ya puedes iniciar sesión.");
          setTimeout(onGoLogin, 900);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoadingVerify(false);
        }
      };

      const handleResend = async () => {
        setError("");
        setSuccess("");
        setLoadingResend(true);

        try {
          const res = await fetch(`${API_URL}/resend-code`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "No se pudo reenviar el código");
          setSuccess(data.message || "Código reenviado. Revisa tu correo.");
        } catch (err) {
          setError(err.message);
        } finally {
          setLoadingResend(false);
        }
      };

      return (
        <div className="max-w-md mx-auto mt-20 animate-fade-in">
          <div className="card space-y-6">
            <h2 className="text-3xl font-bold text-center">Registro</h2>

            {error && <div className="bg-red-500/10 text-red-500 p-3 rounded text-center text-sm">{error}</div>}
            {success && <div className="bg-green-500/10 text-green-500 p-3 rounded text-center text-sm">{success}</div>}

            {!needsVerify && (
              <form onSubmit={handleRegister} className="space-y-4" autoComplete="on">
                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Usuario</label>
                  <input
                    className="input-field"
                    type="text"
                    name="reg_username"
                    autoComplete="username"
                    value={username}
                    onChange={e => setUsername(e.target.value)}
                    required
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Email</label>
                  <input
                    className="input-field"
                    type="email"
                    name="email"
                    autoComplete="email"
                    value={email}
                    onChange={e => setEmail(e.target.value)}
                    required
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Contraseña</label>
                  <input
                    className="input-field"
                    type="password"
                    name="new_password"
                    autoComplete="new-password"
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    required
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Confirmar contraseña</label>
                  <input
                    className="input-field"
                    type="password"
                    name="confirm_new_password"
                    autoComplete="new-password"
                    value={passwordConfirm}
                    onChange={e => setPasswordConfirm(e.target.value)}
                    required
                  />
                </div>

                <button className="btn-primary w-full" disabled={loading}>
                  {loading ? "Creando..." : "Crear Cuenta"}
                </button>

                <p className="text-center text-gray-500 text-sm">
                  ¿Ya tienes cuenta? <button type="button" onClick={onGoLogin} className="text-blue-400 hover:underline">Inicia sesión</button>
                </p>
              </form>
            )}

            {needsVerify && (
              <form onSubmit={handleVerify} className="space-y-4" autoComplete="off">
                <div className="text-center text-gray-400 text-sm">
                  Usuario: <span className="text-white font-semibold">{username}</span>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Código de verificación</label>
                  <input
                    className="input-field"
                    type="text"
                    name="verify_code"
                    autoComplete="one-time-code"
                    inputMode="numeric"
                    value={code}
                    onChange={e => setCode(e.target.value)}
                    placeholder="Ej: 123456"
                    required
                  />
                </div>

                <button className="btn-primary w-full" disabled={loadingVerify}>
                  {loadingVerify ? "Verificando..." : "Validar código y finalizar registro"}
                </button>

                <button
                  type="button"
                  onClick={handleResend}
                  className="w-full bg-white/5 hover:bg-white/10 text-gray-200 px-4 py-3 rounded-lg transition"
                  disabled={loadingResend}
                >
                  {loadingResend ? "Reenviando..." : "Reenviar código"}
                </button>

                <p className="text-center text-gray-500 text-sm">
                  <button type="button" onClick={onGoLogin} className="text-blue-400 hover:underline">
                    Volver a Login
                  </button>
                </p>
              </form>
            )}

          </div>
        </div>
      );
    }

    function ForgotPassword({ onGoLogin }) {
      const [username, setUsername] = useState("");
      const [step, setStep] = useState(1);
      const [code, setCode] = useState("");
      const [newPassword, setNewPassword] = useState("");
      const [newPasswordConfirm, setNewPasswordConfirm] = useState("");

      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [success, setSuccess] = useState("");

      const requestCode = async (e) => {
        e.preventDefault();
        setError(""); setSuccess(""); setLoading(true);

        try {
          const res = await fetch(`${API_URL}/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "No se pudo solicitar el código");
          setSuccess(data.message || "Código enviado. Revisa tu correo.");
          setStep(2);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const resetPass = async (e) => {
        e.preventDefault();
        setError(""); setSuccess("");

        if (newPassword !== newPasswordConfirm) {
          setError("Las contraseñas no coinciden.");
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(`${API_URL}/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, code, new_password: newPassword })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "No se pudo cambiar la contraseña");
          setSuccess("✓ Contraseña actualizada. Ya puedes iniciar sesión.");
          setTimeout(onGoLogin, 900);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-md mx-auto mt-20 animate-fade-in">
          <div className="card space-y-6">
            <h2 className="text-3xl font-bold text-center">Recuperar contraseña</h2>

            {error && <div className="bg-red-500/10 text-red-500 p-3 rounded text-center text-sm">{error}</div>}
            {success && <div className="bg-green-500/10 text-green-500 p-3 rounded text-center text-sm">{success}</div>}

            {step === 1 && (
              <form onSubmit={requestCode} className="space-y-4" autoComplete="on">
                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Usuario</label>
                  <input
                    className="input-field"
                    type="text"
                    name="fp_username"
                    autoComplete="username"
                    value={username}
                    onChange={e => setUsername(e.target.value)}
                    required
                  />
                </div>
                <button className="btn-primary w-full" disabled={loading}>
                  {loading ? "Enviando..." : "Enviar código al correo"}
                </button>

                <p className="text-center text-gray-500 text-sm">
                  <button type="button" onClick={onGoLogin} className="text-blue-400 hover:underline">
                    Volver a Login
                  </button>
                </p>
              </form>
            )}

            {step === 2 && (
              <form onSubmit={resetPass} className="space-y-4" autoComplete="off">
                <div className="text-center text-gray-400 text-sm">
                  Usuario: <span className="text-white font-semibold">{username}</span>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Código</label>
                  <input
                    className="input-field"
                    type="text"
                    name="reset_code"
                    autoComplete="one-time-code"
                    inputMode="numeric"
                    value={code}
                    onChange={e => setCode(e.target.value)}
                    placeholder="Ej: 123456"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Nueva contraseña</label>
                  <input
                    className="input-field"
                    type="password"
                    name="fp_new_password"
                    autoComplete="new-password"
                    value={newPassword}
                    onChange={e => setNewPassword(e.target.value)}
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-400 mb-1">Confirmar nueva contraseña</label>
                  <input
                    className="input-field"
                    type="password"
                    name="fp_confirm_new_password"
                    autoComplete="new-password"
                    value={newPasswordConfirm}
                    onChange={e => setNewPasswordConfirm(e.target.value)}
                    required
                  />
                </div>

                <button className="btn-primary w-full" disabled={loading}>
                  {loading ? "Actualizando..." : "Actualizar contraseña"}
                </button>

                <p className="text-center text-gray-500 text-sm">
                  <button type="button" onClick={onGoLogin} className="text-blue-400 hover:underline">
                    Volver a Login
                  </button>
                </p>
              </form>
            )}
          </div>
        </div>
      );
    }

    function Dashboard() {
      const [activeTab, setActiveTab] = useState("laliga"); // laliga, scout, graphics

      return (
        <div className="animate-fade-in space-y-8">
          <div className="flex space-x-4 border-b border-gray-700 pb-2">
            <button
              onClick={() => setActiveTab("laliga")}
              className={`pb-2 px-4 font-semibold ${activeTab === 'laliga' ? 'text-blue-400 border-b-2 border-blue-400' : 'text-gray-400 hover:text-white'}`}
            >
              <i className="fas fa-trophy mr-2"></i>La Liga
            </button>
            <button
              onClick={() => setActiveTab("scout")}
              className={`pb-2 px-4 font-semibold ${activeTab === 'scout' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-gray-400 hover:text-white'}`}
            >
              <i className="fas fa-search mr-2"></i>Ojeador AI
            </button>
            <button
              onClick={() => setActiveTab("graphics")}
              className={`pb-2 px-4 font-semibold ${activeTab === 'graphics' ? 'text-purple-400 border-b-2 border-purple-400' : 'text-gray-400 hover:text-white'}`}
            >
              <i className="fas fa-chart-pie mr-2"></i>Gráficos
            </button>
          </div>

          <div className="mt-6">
            {activeTab === "laliga" && <LaLigaView />}
            {activeTab === "scout" && <ScoutView />}
            {activeTab === "graphics" && <GraphicsView />}
          </div>
        </div>
      );
    }

    // --- Todo lo demás (LaLigaView, TeamDetail, ScoutView, GraphicsView, Charts) igual ---
    function LaLigaView() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [updating, setUpdating] = useState(false);
      const [selectedTeam, setSelectedTeam] = useState(null);
      const [msg, setMsg] = useState("");

      const fetchData = () => {
        setLoading(true);
        fetch(`${API_URL}/laliga`)
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) setData(data);
            else setData([]);
          })
          .catch(console.error)
          .finally(() => setLoading(false));
      };

      useEffect(() => {
        fetchData();
      }, []);

      const handleUpdate = async () => {
        setUpdating(true);
        setMsg("");
        try {
          const res = await fetch(`${API_URL}/laliga/update`, { method: "POST" });
          const dat = await res.json();
          if (!res.ok) throw new Error(dat.detail || dat.message);
          setMsg("✓ Datos actualizados correctamente");
          setTimeout(() => setMsg(""), 3000);
          fetchData();
        } catch (e) {
          setMsg("❌ Error al actualizar: " + e.message);
        } finally {
          setUpdating(false);
        }
      };

      if (loading && data.length === 0) return <div className="text-center p-10"><i className="fas fa-spinner fa-spin text-4xl text-blue-500"></i></div>;

      return (
        <div className="flex flex-col lg:flex-row gap-6">
          <div className="w-full lg:w-2/3">
            <div className="card overflow-hidden">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-xl font-bold">Clasificación 2024-25</h3>
                <button
                  onClick={handleUpdate}
                  disabled={updating}
                  className={`text-sm px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 transition ${updating ? 'opacity-50' : ''}`}
                >
                  {updating ? <i className="fas fa-sync fa-spin"></i> : <i className="fas fa-sync"></i>} Actualizar
                </button>
              </div>
              {msg && <div className="mb-2 text-sm text-center bg-blue-500/10 text-blue-300 p-2 rounded animate-fade-in">{msg}</div>}

              {data.length === 0 ? (
                <div className="p-4 text-center text-gray-500">No hay datos. Pulsa actualizar.</div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-gray-800 text-gray-300 text-sm uppercase">
                        <th className="p-3">Pos</th>
                        <th className="p-3">Equipo</th>
                        <th className="p-3 text-center">PJ</th>
                        <th className="p-3 text-center">Pts</th>
                        <th className="p-3 text-center hidden md:table-cell">GF</th>
                        <th className="p-3 text-center hidden md:table-cell">GC</th>
                        <th className="p-3 text-center hidden md:table-cell">Dif</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-700">
                      {data.map((team) => (
                        <tr
                          key={team.Equipo}
                          onClick={() => setSelectedTeam(team)}
                          className={`cursor-pointer hover:bg-white/5 transition ${selectedTeam?.Equipo === team.Equipo ? 'bg-blue-500/20' : ''}`}
                        >
                          <td className="p-3 font-mono">{team.Pos}</td>
                          <td className="p-3 font-semibold">{team.Equipo}</td>
                          <td className="p-3 text-center text-gray-400">{team.PJ}</td>
                          <td className="p-3 text-center font-bold text-white">{team.Pts}</td>
                          <td className="p-3 text-center hidden md:table-cell text-green-400">{team.GF}</td>
                          <td className="p-3 text-center hidden md:table-cell text-red-400">{team.GC}</td>
                          <td className="p-3 text-center hidden md:table-cell text-gray-400">{team.Dif}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
          <div className="w-full lg:w-1/3">
            {selectedTeam ? (
              <TeamDetail team={selectedTeam} />
            ) : (
              <div className="card h-full flex items-center justify-center text-gray-500 p-10 text-center border-dashed">
                Selecciona un equipo para ver estadísticas detalladas
              </div>
            )}
          </div>
        </div>
      );
    }

    function TeamDetail({ team }) {
      const [stats, setStats] = useState(null);

      useEffect(() => {
        fetch(`${API_URL}/laliga/${team.Equipo}`)
          .then(res => res.json())
          .then(setStats)
          .catch(console.error);
      }, [team]);

      if (!stats) return <div className="card p-6 text-center">Cargando detalles...</div>;

      return (
        <div className="card space-y-6 animate-fade-in sticky top-24">
          <div className="text-center">
            <div className="w-20 h-20 bg-gray-700 rounded-full mx-auto flex items-center justify-center text-3xl mb-4">⚽</div>
            <h2 className="text-2xl font-bold">{stats.Equipo}</h2>
            <span className="inline-block bg-blue-500/20 text-blue-300 px-3 py-1 rounded-full text-sm mt-2">
              Posición {stats.Pos}
            </span>
          </div>

          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="bg-gray-800 p-3 rounded">
              <div className="text-green-400 font-bold text-xl">{stats.G}</div>
              <div className="text-xs text-gray-500">Victorias</div>
            </div>
            <div className="bg-gray-800 p-3 rounded">
              <div className="text-yellow-400 font-bold text-xl">{stats.E}</div>
              <div className="text-xs text-gray-500">Empates</div>
            </div>
            <div className="bg-gray-800 p-3 rounded">
              <div className="text-red-400 font-bold text-xl">{stats.P}</div>
              <div className="text-xs text-gray-500">Derrotas</div>
            </div>
          </div>

          {stats.eficiencia_ofensiva && (
            <div className="space-y-3">
              <h4 className="text-sm font-semibold text-gray-400 uppercase tracking-wider">Métricas Avanzadas</h4>
              <div className="space-y-2">
                <div className="flex justify-between text-sm">
                  <span className="text-gray-400">Puntos/Partido</span>
                  <span>{stats.puntos_por_partido?.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-sm">
                  <span className="text-gray-400">Eficiencia Ofensiva</span>
                  <span>{stats.eficiencia_ofensiva?.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-sm">
                  <span className="text-gray-400">Eficiencia Defensiva</span>
                  <span>{stats.eficiencia_defensiva?.toFixed(2)}</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ScoutView() {
      const [query, setQuery] = useState("");
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleSearch = async (e) => {
        e.preventDefault();
        if (!query.trim()) return;

        setLoading(true);
        setError("");
        setResult(null);

        try {
          const res = await fetch(`${API_URL}/scout`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: query })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Jugador no encontrado");
          setResult(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-2xl mx-auto space-y-8">
          <div className="text-center space-y-2">
            <h2 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">
              Ojeador Inteligente
            </h2>
            <p className="text-gray-400">Busca jugadores en la base de datos global</p>
          </div>

          <form onSubmit={handleSearch} className="relative">
            <input
              type="text"
              className="input-field pl-12 py-4 text-lg rounded-full shadow-lg"
              placeholder="Nombre del jugador (ej: Messi, Bellingham...)"
              value={query}
              onChange={e => setQuery(e.target.value)}
            />
            <i className="fas fa-search absolute left-5 top-5 text-gray-500"></i>
            <button type="submit" className="absolute right-2 top-2 bg-emerald-500 hover:bg-emerald-600 text-white p-2 rounded-full w-10 h-10 flex items-center justify-center transition" disabled={loading}>
              {loading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-arrow-right"></i>}
            </button>
          </form>

          {error && (
            <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-lg text-red-400 text-center animate-fade-in">
              <i className="fas fa-exclamation-circle mr-2"></i> {error}
            </div>
          )}

          {result && (
            <div className="card animate-fade-in overflow-hidden border-emerald-500/30">
              <div className="flex flex-col md:flex-row gap-6">
                <div className="w-full md:w-1/3">
                  {result.foto_url ? (
                    <img src={result.foto_url} alt={result.nombre} className="w-full h-auto rounded-lg object-cover bg-gray-900" />
                  ) : (
                    <div className="w-full h-64 bg-gray-800 rounded-lg flex items-center justify-center text-gray-600">
                      <i className="fas fa-user-slash text-5xl"></i>
                    </div>
                  )}
                </div>
                <div className="flex-1 space-y-4">
                  <div>
                    <h3 className="text-3xl font-bold text-white">{result.nombre}</h3>
                    <p className="text-emerald-400 font-semibold">{result.equipo}</p>
                  </div>

                  <div className="grid grid-cols-2 gap-4 text-sm">
                    <div className="bg-gray-800/50 p-3 rounded">
                      <span className="block text-gray-500">Nacionalidad</span>
                      <span className="font-medium">{result.nacionalidad}</span>
                    </div>
                    <div className="bg-gray-800/50 p-3 rounded">
                      <span className="block text-gray-500">Posición</span>
                      <span className="font-medium">{result.posicion}</span>
                    </div>
                    <div className="bg-gray-800/50 p-3 rounded">
                      <span className="block text-gray-500">Edad</span>
                      <span className="font-medium">{result.edad} años</span>
                    </div>
                    <div className="bg-gray-800/50 p-3 rounded">
                      <span className="block text-gray-500">Estado</span>
                      <span className="font-medium">{result.estado || 'N/A'}</span>
                    </div>
                  </div>

                  {result.description && (
                    <div className="text-gray-400 text-xs mt-2 line-clamp-3">
                      {result.description}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function GraphicsView() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(`${API_URL}/laliga`)
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) setData(data);
          })
          .catch(console.error)
          .finally(() => setLoading(false));
      }, []);

      if (loading) return <div className="text-center p-10"><i className="fas fa-spinner fa-spin text-4xl text-purple-500"></i></div>;
      if (data.length === 0) return <div className="text-center text-gray-500">No hay datos. Ve a "La Liga" e intenta actualizar.</div>;

      return (
        <div className="space-y-8 animate-fade-in">
          <Top10Chart data={data} />
          <TeamStatsChart data={data} />
        </div>
      );
    }

    function Top10Chart({ data }) {
      const canvasRef = React.useRef(null);
      const chartRef = React.useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !data.length) return;

        const top10 = data.slice(0, 10);
        const ctx = canvasRef.current.getContext('2d');

        if (chartRef.current) chartRef.current.destroy();

        chartRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: top10.map(d => d.Equipo),
            datasets: [{
              label: 'Puntos',
              data: top10.map(d => d.Pts),
              backgroundColor: top10.map((_, i) => `hsla(${240 + i * 10}, 70%, 60%, 0.8)`),
              borderColor: top10.map((_, i) => `hsla(${240 + i * 10}, 70%, 60%, 1)`),
              borderWidth: 1
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            plugins: {
              legend: { display: false },
              title: { display: true, text: 'Top 10 Clasificación', color: 'white', font: { size: 16 } }
            },
            scales: {
              y: { ticks: { color: 'white' }, grid: { color: '#334155' } },
              x: { ticks: { color: 'white' }, grid: { color: '#334155' } }
            }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [data]);

      return (
        <div className="card p-4">
          <canvas ref={canvasRef} height="100"></canvas>
        </div>
      );
    }

    function TeamStatsChart({ data }) {
      const [selectedTeam, setSelectedTeam] = useState(data[0]?.Equipo || "");
      const canvasRef = React.useRef(null);
      const chartRef = React.useRef(null);

      const teamData = data.find(d => d.Equipo === selectedTeam);

      useEffect(() => {
        if (!canvasRef.current || !teamData) return;

        const ctx = canvasRef.current.getContext('2d');
        if (chartRef.current) chartRef.current.destroy();

        const maxPJ = teamData.PJ || 1;
        const winRate = (teamData.G / maxPJ) * 100;
        const drawRate = (teamData.E / maxPJ) * 100;
        const lossRate = (teamData.P / maxPJ) * 100;
        const gfRate = Math.min((teamData.GF / (maxPJ * 3)) * 100, 100);
        const gcRate = Math.min((teamData.GC / (maxPJ * 3)) * 100, 100);

        chartRef.current = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: ['Victorias %', 'Empates %', 'Derrotas %', 'Potencia Ofensiva', 'Fragilidad Defensiva'],
            datasets: [{
              label: selectedTeam,
              data: [winRate, drawRate, lossRate, gfRate, gcRate],
              backgroundColor: 'rgba(168, 85, 247, 0.2)',
              borderColor: 'rgba(168, 85, 247, 1)',
              pointBackgroundColor: 'white',
              borderWidth: 2,
            }]
          },
          options: {
            responsive: true,
            plugins: {
              title: { display: true, text: `Análisis de ${selectedTeam}`, color: 'white', font: { size: 16 } },
              legend: { display: false }
            },
            scales: {
              r: {
                angleLines: { color: '#334155' },
                grid: { color: '#334155' },
                pointLabels: { color: 'white', font: { size: 12 } },
                ticks: { backdropColor: 'transparent', color: 'transparent' },
                suggestedMin: 0,
                suggestedMax: 100
              }
            }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [selectedTeam, teamData]);

      return (
        <div className="card p-6">
          <div className="mb-4">
            <label className="block text-sm text-gray-400 mb-1">Selecciona Equipo a Analizar:</label>
            <select
              className="input-field"
              value={selectedTeam}
              onChange={e => setSelectedTeam(e.target.value)}
            >
              {data.map(d => <option key={d.Equipo} value={d.Equipo}>{d.Equipo}</option>)}
            </select>
          </div>
          <div className="h-64 md:h-96 flex justify-center">
            <canvas ref={canvasRef}></canvas>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
